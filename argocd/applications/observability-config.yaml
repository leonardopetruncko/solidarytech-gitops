# Observabilidade como código: regras de SLO (PrometheusRule), dashboards (SRE e Golden
# Metrics), alertas, contact points e o self-healer. Kustomize em observability/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: observability
  source:
    repoURL: 'https://github.com/leonardopetruncko/solidarytech-gitops.git'
    targetRevision: main
    path: observability/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m