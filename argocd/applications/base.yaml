# Namespace + guardrails de FinOps do namespace (LimitRange e ResourceQuota).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: solidarytech
  source:
    repoURL: 'https://github.com/leonardopetruncko/solidarytech-gitops.git'
    targetRevision: main
    path: apps/base
  destination:
    server: https://kubernetes.default.svc
    namespace: solidarytech
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true