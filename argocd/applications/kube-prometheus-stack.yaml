# Prometheus (métricas + regras de SLO) + Grafana (dashboards e alertas) + kube-state-metrics.
# Multi-source: chart do repositório Helm oficial + values versionado neste repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: observability
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values/kube-prometheus-stack.yaml
    - repoURL: 'https://github.com/leonardopetruncko/solidarytech-gitops.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Os CRDs do Prometheus Operator passam do limite de annotation do apply comum.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m