# App-of-Apps: a ÚNICA coisa aplicada à mão (uma vez por cluster, pelo scripts/subir.ps1).
# Daqui em diante o Argo CD gerencia tudo o que está em argocd/applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-root
  namespace: argocd
spec:
  project: solidarytech
  source:
    repoURL: 'https://github.com/leonardopetruncko/solidarytech-gitops.git'
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true