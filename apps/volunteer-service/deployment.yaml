# Voluntários (Python/Flask + DynamoDB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    app: volunteer-service
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # deploy sem derrubar capacidade (não queima error budget)
      maxSurge: 1
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
        app.kubernetes.io/part-of: solidarytech
        # Tags de custo também no Kubernetes (rateio por serviço no relatório de FinOps).
        cost-center: ngo-core
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: volunteer-service
          image: ECR_REGISTRY/volunteer-service:inicial
          ports:
            - name: http
              containerPort: 8083
          env:
            # --- OpenTelemetry: traces e métricas para o OTel Collector do nó ---
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: "volunteer-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=solidarytech,service.version=fase5,deployment.environment=production,service.instance.id=$(POD_NAME)"
            - name: PORT
              value: "8083"
            # Região do site ativo (primário us-east-1 ou DR us-west-2), criada pelo subir.ps1/dr.ps1.
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: solidarytech-site
                  key: AWS_REGION
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: volunteer-service-config
                  key: AWS_DYNAMODB_TABLE
          # Rightsizing (FinOps): valores medidos com kubectl top / Grafana (ver docs/finops.md).
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 300m
              memory: 320Mi
          # Liveness só vê o processo; readiness vê a dependência (banco/DynamoDB).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
