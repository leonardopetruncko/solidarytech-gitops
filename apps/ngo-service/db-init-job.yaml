# Inicializa o banco do ngo-service a cada sync do Argo CD, ANTES do Deployment (hook PreSync):
# cria o usuário e o banco do serviço e aplica o schema. Tudo idempotente.
# Substitui o "rodar SQL na mão": o banco nasce pelo GitOps, como o resto.
apiVersion: batch/v1
kind: Job
metadata:
  name: ngo-service-db-init
  namespace: solidarytech
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: ngo-service-db-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # usuário "postgres" da imagem alpine
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: solidarytech-db-admin
                  key: PGHOST
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: solidarytech-db-admin
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: solidarytech-db-admin
                  key: PGPASSWORD
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: ngo-service-secret
                  key: DB_USER
            - name: APP_PASS
              valueFrom:
                secretKeyRef:
                  name: ngo-service-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: ngo_db
          command: ["sh", "-c"]
          args:
            - |
              set -e
              psql -d postgres -v ON_ERROR_STOP=1 -q \
                -v app_user="$APP_USER" -v app_pass="$APP_PASS" -v db_name="$DB_NAME" \
                -f /sql/bootstrap.sql
              PGUSER="$APP_USER" PGPASSWORD="$APP_PASS" psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -q -f /sql/init.sql
              echo "Banco $DB_NAME pronto para o ngo-service."
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: ngo-service-db-init